<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cassie and the White Sable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --paper: #f4ecd9;
      --paper-deep: #ebe0c7;
      --ink: #3f3226;
      --ink-soft: #7a6a58;
      --prompt: #6f7a46;
      --desk: #2c2620;
      --serif: "EB Garamond", Garamond, "Iowan Old Style", Georgia, serif;
      --title: "IM Fell English SC", "EB Garamond", Georgia, serif;
    }
    html, body { height: 100%; background: var(--desk); overflow: hidden; }
    body {
      font-family: var(--serif);
      color: var(--ink);
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* The book */
    #book {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    #page {
      position: relative;
      width: min(1280px, 100%); height: min(760px, 100%);
      background: var(--paper);
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.09 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"),
        radial-gradient(ellipse at 50% 40%, rgba(255,250,236,0.6), rgba(0,0,0,0) 70%);
      border-radius: 4px;
      box-shadow: 0 2px 0 #d9ccb0, 0 4px 0 #cdbf9f, 0 18px 50px rgba(0,0,0,0.5);
      display: flex; flex-direction: row; overflow: hidden;
    }
    #page::after { /* the gutter between the two sides of the spread */
      content: ""; position: absolute; top: 0; bottom: 0; left: 62%; width: 40px; transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(0,0,0,0), rgba(90,70,40,0.10) 45%, rgba(90,70,40,0.16) 50%, rgba(90,70,40,0.10) 55%, rgba(0,0,0,0));
      pointer-events: none;
    }
    #plate { position: relative; flex: 0 0 62%; display: flex; align-items: center; justify-content: center; }
    #art { width: 100%; height: 100%; display: block; touch-action: none; overflow: hidden; }
    #side { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; padding: 46px 44px 64px 40px; overflow: hidden; }
    #words { flex: 1 1 auto; overflow-y: auto; font-size: clamp(17px, 1.62vw, 22px); line-height: 1.55; scrollbar-width: thin; padding-right: 4px; }
    #words h1 { font-family: var(--title); font-weight: 400; font-size: 1.45em; line-height: 1.15; letter-spacing: 0.01em; margin-bottom: 0.8em; color: #5a4632; }
    #words p { margin-bottom: 0.75em; }
    #words p.first::first-letter { font-family: var(--title); float: left; font-size: 3.1em; line-height: 0.85; padding: 0.06em 0.08em 0 0; color: #6f5a3a; }
    #words p.added { animation: fadein 1.2s ease both; }
    #words p.speech { font-style: italic; }
    #words p.end { font-family: var(--title); text-align: center; font-size: 1.3em; margin-top: 1em; color: #6f5a3a; }
    #prompt { flex: 0 0 auto; font-style: italic; color: var(--prompt); font-size: clamp(16px, 1.45vw, 20px); line-height: 1.4; min-height: 1.6em; margin-top: 10px; transition: opacity .6s; }
    #prompt::before { content: "❧ "; font-style: normal; color: #9aa06c; }
    #prompt:empty::before { content: ""; }
    #prompt.nudge { animation: nudge .7s ease; }
    /* page turning */
    .turn { position: absolute; bottom: 10px; width: 64px; height: 52px; border: 0; background: none; cursor: pointer; color: var(--ink-soft); font: 30px/1 var(--title); display: flex; align-items: center; justify-content: center; transition: opacity .4s, color .3s, transform .3s; z-index: 4; }
    #prev { left: 8px; }
    #next { right: 8px; }
    .turn:hover { color: var(--ink); }
    .turn[disabled] { opacity: 0.18; cursor: default; }
    #next.ready { animation: ready 1.6s ease-in-out 2; }
    #folio { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font: 14px/1 var(--title); color: var(--ink-soft); pointer-events: none; z-index: 3; }
    #home, #sound { position: fixed; z-index: 10; top: max(8px, env(safe-area-inset-top)); color: #b9ab8c; font: 15px/1 var(--title); text-decoration: none; padding: 8px 12px; cursor: pointer; opacity: 0.7; }
    #home { left: max(8px, env(safe-area-inset-left)); }
    #sound { right: max(8px, env(safe-area-inset-right)); }
    #sound.off { opacity: 0.3; text-decoration: line-through; }
    #again { display: block; margin: 1.2em auto 0; font: 18px/1 var(--title); color: #6f5a3a; background: none; border: 1px solid #c9b88f; border-radius: 3px; padding: 10px 18px; cursor: pointer; }
    #fade { transition: opacity .45s ease; }
    #fade.out { opacity: 0; }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes nudge { 0%,100% { transform: none; } 30% { transform: translateX(-5px); } 60% { transform: translateX(4px); } }
    @keyframes ready { 0%,100% { transform: none; } 50% { transform: translateX(6px); color: #4a3a2a; } }

    /* Portrait: picture above, words below */
    @media (max-aspect-ratio: 5/4) {
      #page { flex-direction: column; height: 100%; }
      #page::after { display: none; }
      #plate { flex: 0 0 auto; width: 100%; aspect-ratio: 16 / 10; }
      #side { padding: 14px 22px 70px; }
      #words { font-size: clamp(17px, 4.3vw, 21px); }
    }

    /* ── Life in the pictures ─────────────────────────────────────────── */
    #art .pop { animation: pop .95s cubic-bezier(.2,1.3,.4,1) both; transform-box: fill-box; transform-origin: 50% 100%; animation-delay: var(--d, 0s); }
    @keyframes pop { from { transform: translateY(26px) scaleY(.55); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
    #art .hot { cursor: pointer; }
    #art .grab { cursor: grab; }
    #art .fig { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4.2s ease-in-out infinite; animation-delay: var(--b, 0s); }
    @keyframes breathe { 50% { transform: scaleY(1.012); } }
    #art .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(1.4deg); } }
    #art .drift { animation: drift 30s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(90px); } }
    #art .twinkle circle { animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: .25; } }
    #art .flicker { animation: flicker 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes flicker { 30% { opacity: .82; transform: scale(.96); } 60% { opacity: 1; transform: scale(1.03); } }
    #art .flames { transform-box: fill-box; transform-origin: 50% 100%; animation: flames .9s ease-in-out infinite alternate; }
    @keyframes flames { to { transform: scaleY(1.12) scaleX(.94); } }
    #art .flame1 { transform-box: fill-box; transform-origin: 50% 100%; animation: flames 1.1s ease-in-out infinite alternate; }
    #art .rainsheet { animation: rain .8s linear infinite; }
    @keyframes rain { from { transform: translate(0, 0); } to { transform: translate(-20px, 1000px); } }
    #art .smoke, #art .steam { animation: smoke 7s ease-in-out infinite; transform-box: fill-box; }
    @keyframes smoke { 0% { transform: translateY(8px); opacity: .5; } 50% { opacity: .9; } 100% { transform: translateY(-14px) translateX(10px); opacity: .4; } }
    #art .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: tail 2.6s ease-in-out infinite; }
    @keyframes tail { 50% { transform: rotate(-6deg); } }
    #art .pearl { animation: pearl 3.4s ease-in-out infinite; }
    @keyframes pearl { 50% { opacity: .55; } }
    #art .bobbing { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    #art .buzz { animation: buzz 7s linear infinite; }
    @keyframes buzz { 0% { transform: translate(0,0); } 25% { transform: translate(60px,-30px); } 50% { transform: translate(120px,10px); } 75% { transform: translate(50px,30px); } 100% { transform: translate(0,0); } }
    #art .sparkle { animation: spark 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; pointer-events: none; }
    @keyframes spark { 0%,100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(30deg); } }
    #art .spirit-eyes circle { animation: twinkle 4s ease-in-out infinite; }
    #art .flash { animation: flash 1.2s ease-out both; }
    @keyframes flash { 0% { opacity: 0; } 8% { opacity: .9; } 16% { opacity: .2; } 24% { opacity: .8; } 100% { opacity: 0; } }
    #art .glimmer { animation: glimmer 3s ease-in-out infinite; }
    @keyframes glimmer { 50% { opacity: .35; } }
    #art .slow { transition: transform 1.6s cubic-bezier(.35,.1,.25,1), opacity 1.2s; }
    #art .med { transition: transform .8s cubic-bezier(.35,.1,.25,1), opacity .8s; }
    #art .fast { transition: transform .35s cubic-bezier(.35,.1,.25,1), opacity .35s; }
    #art .gone { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      #art .fig, #art .sway, #art .drift, #art .tail, #art .bobbing, #art .buzz { animation: none; }
    }
  </style>
</head>
<body>
  <div id="book">
    <div id="page">
      <div id="plate"><svg id="art" viewBox="70 50 1460 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
      <div id="side"><div id="fade"><div id="words" aria-live="polite"></div></div><div id="prompt"></div></div>
      <button class="turn" id="prev" aria-label="previous page">‹</button>
      <div id="folio"></div>
      <button class="turn" id="next" aria-label="next page">›</button>
    </div>
  </div>
  <a id="home" href="/" aria-label="back">‹</a>
  <div id="sound" role="button" aria-label="sound">♪</div>
  <script src="art.js"></script>
  <script src="music.js"></script>
  <script src="pages.js"></script>
  <script>
  (() => {
    'use strict';
    const A = window.ART, PAGES = window.BOOK.pages, M = window.BOOK_MUSIC || null;
    const svg = document.getElementById('art');
    const words = document.getElementById('words');
    const promptEl = document.getElementById('prompt');
    const fade = document.getElementById('fade');
    const nextBtn = document.getElementById('next'), prevBtn = document.getElementById('prev');
    const folio = document.getElementById('folio');
    let at = -1, api = null, busy = false;

    // ─── Sound ────────────────────────────────────────────────────────────
    const soundEl = document.getElementById('sound');
    if (!M) soundEl.style.display = 'none'; else soundEl.classList.toggle('off', M.muted);
    soundEl.addEventListener('click', e => { e.stopPropagation(); if (!M) return; M.start(); M.setMuted(!M.muted); soundEl.classList.toggle('off', M.muted); });
    const wake = () => { if (M && !M.muted) M.start(); };
    window.addEventListener('pointerdown', wake);
    window.addEventListener('keydown', wake);

    // ─── One page's world: what the page's build() can use ───────────────
    function makeApi(page, index) {
      const timers = [], hots = [];
      const done = new Set();
      const need = page.need ? page.need.slice() : [];
      let idleAt = performance.now(), hintTimer = 0, sparkle = null;
      const root = A.scene(svg, 11 + index * 7);
      const a = {
        A, C: A.C, root, svg, index,
        layer(delay) {
          const g = A.g(root, { class: 'pop', style: `--d:${(delay || 0).toFixed(2)}s` });
          return g;
        },
        after(ms, fn) { const t = setTimeout(() => { if (api === a) fn(); }, ms); timers.push(t); return t; },
        every(ms, fn) { const t = setInterval(() => { if (api === a) fn(); }, ms); timers.push(t); return t; },
        add(text, cls) {
          const p = document.createElement('p');
          p.className = 'added' + (cls ? ' ' + cls : '');
          p.innerHTML = text;
          words.appendChild(p);
          a.after(60, () => { words.scrollTo({ top: words.scrollHeight, behavior: 'smooth' }); });
          return p;
        },
        prompt(text) { promptEl.textContent = text || ''; },
        sfx(name, opt) { if (M) M.sfx(name, opt); },
        mood(name) { if (M) M.setMood(name); },
        done(key) {
          if (done.has(key)) return false;
          done.add(key);
          idleAt = performance.now();
          clearSpark();
          if (need.every(k => done.has(k))) { setNext(true); if (page.complete) page.complete(a); }
          return true;
        },
        has(key) { return done.has(key); },
        isDone() { return need.every(k => done.has(k)); },
        // Make something tappable. key: the requirement it helps with (for hints).
        hot(el, fn, o = {}) {
          el.classList.add('hot');
          // A forgiving, invisible hit area around small things (fingers are bigger than sables).
          if (el.tagName === 'g' && !o.exact) requestAnimationFrame(() => {
            try {
              const bb = el.getBBox(), pad = o.pad ?? 14;
              if (bb.width && bb.height) el.insertBefore(A.el('rect', { x: bb.x - pad, y: bb.y - pad, width: bb.width + pad * 2, height: bb.height + pad * 2, fill: '#000', 'fill-opacity': 0.001 }), el.firstChild);
            } catch (e) {}
          });
          const h = { el, key: o.key, enabled: true };
          hots.push(h);
          el.addEventListener('click', ev => {
            ev.stopPropagation();
            if (!h.enabled) return;
            idleAt = performance.now(); clearSpark();
            fn(ev);
            if (o.once) { h.enabled = false; el.classList.remove('hot'); }
          });
          return h;
        },
        // Drag something around the picture. The element is wrapped so its own transform is kept.
        drag(el, o = {}) {
          const wrap = A.g(el.parentNode);
          wrap.appendChild(el);
          wrap.classList.add('grab');
          const h = { el: wrap, key: o.key, enabled: true, x: 0, y: 0, home: [0, 0] };
          hots.push(h);
          let start = null;
          const toSvg = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
          wrap.addEventListener('pointerdown', ev => {
            if (!h.enabled) return;
            ev.stopPropagation(); ev.preventDefault();
            wrap.setPointerCapture(ev.pointerId);
            const p = toSvg(ev);
            start = { px: p.x, py: p.y, x: h.x, y: h.y };
            wrap.style.transition = 'none';
            idleAt = performance.now(); clearSpark();
            if (o.start) o.start(h);
          });
          wrap.addEventListener('pointermove', ev => {
            if (!start) return;
            const p = toSvg(ev);
            h.x = start.x + p.x - start.px; h.y = start.y + p.y - start.py;
            wrap.setAttribute('transform', `translate(${h.x},${h.y})`);
            if (o.move) o.move(h, h.x, h.y);
          });
          const end = ev => {
            if (!start) return;
            start = null;
            const keep = o.end ? o.end(h, h.x, h.y) : true;
            if (keep === false) a.moveTo(h, 0, 0, 500);
          };
          wrap.addEventListener('pointerup', end);
          wrap.addEventListener('pointercancel', end);
          return h;
        },
        moveTo(h, x, y, ms = 800) {
          const el = h.el || h;
          const from = [h.x || 0, h.y || 0], t0 = performance.now();
          const step = t => {
            const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            const cx = from[0] + (x - from[0]) * e, cy = from[1] + (y - from[1]) * e;
            el.setAttribute('transform', `translate(${cx},${cy})`);
            if (h.x !== undefined) { h.x = cx; h.y = cy; }
            if (k < 1 && api === a) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        },
        // Wrap a group so it can be moved with moveTo.
        mover(el) { const w = A.g(el.parentNode); w.appendChild(el); return { el: w, x: 0, y: 0 }; },
        teardown() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); clearInterval(hintTimer); },
      };
      function clearSpark() { if (sparkle) { sparkle.remove(); sparkle = null; } }
      // If the reader is stuck, a small sparkle shows them where to look.
      hintTimer = setInterval(() => {
        if (api !== a || a.isDone() || sparkle) return;
        if (performance.now() - idleAt < (page.hintAfter || 7000)) return;
        const h = hots.find(h => h.enabled && h.key && !done.has(h.key)) || hots.find(h => h.enabled && h.key);
        if (!h) return;
        const b = h.el.getBBox ? bboxIn(h.el) : null;
        if (!b) return;
        sparkle = A.sparkle(root, b.x + b.width / 2, b.y + b.height / 2, 1.6);
      }, 700);
      function bboxIn(el) {
        try {
          const bb = el.getBBox(), m = el.getCTM(), rm = root.getCTM().inverse().multiply(m);
          const pt = svg.createSVGPoint(); pt.x = bb.x + bb.width / 2; pt.y = bb.y + bb.height / 2;
          const c = pt.matrixTransform(rm);
          return { x: c.x - 1, y: c.y - 1, width: 2, height: 2 };
        } catch (e) { return null; }
      }
      a.clearHint = clearSpark;
      return a;
    }

    function setNext(on) {
      const wasOff = nextBtn.disabled;
      nextBtn.disabled = !on || at >= PAGES.length - 1;
      if (on && wasOff && at > 0) { nextBtn.classList.remove('ready'); void nextBtn.offsetWidth; nextBtn.classList.add('ready'); }
    }

    // ─── Turning pages ───────────────────────────────────────────────────
    function show(i) {
      if (i < 0 || i >= PAGES.length || busy) return;
      busy = true;
      fade.classList.add('out');
      svg.style.transition = 'opacity .45s'; svg.style.opacity = 0;
      setTimeout(() => {
        if (api) api.teardown();
        at = i;
        const page = PAGES[i];
        svg.innerHTML = '';
        A.defs(svg);
        words.innerHTML = (page.title ? `<h1>${page.title}</h1>` : '') + page.text.map((t, k) => `<p class="${k === 0 && !page.noDrop ? 'first' : ''}">${t}</p>`).join('');
        words.scrollTop = 0;
        promptEl.textContent = page.prompt || '';
        folio.textContent = i > 0 && i < PAGES.length - 1 ? String(i) : '';
        api = makeApi(page, i);
        if (M && page.mood) M.setMood(page.mood);
        page.build(api);
        setNext(!(page.need && page.need.length));
        if (page.wait) { nextBtn.disabled = true; api.after(page.wait, () => setNext(true)); }
        prevBtn.disabled = i === 0;
        svg.style.opacity = 1;
        fade.classList.remove('out');
        try { history.replaceState(null, '', i ? '#' + i : location.pathname); } catch (e) {}
        setTimeout(() => { busy = false; }, 300);
      }, at < 0 ? 0 : 420);
    }
    function next() {
      if (nextBtn.disabled) { promptEl.classList.remove('nudge'); void promptEl.offsetWidth; promptEl.classList.add('nudge'); return; }
      if (M) M.sfx('page');
      show(at + 1);
    }
    function prev() { if (at > 0) { if (M) M.sfx('page'); show(at - 1); } }
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    });
    // Swipe across the words to turn
    let sx = null;
    const side = document.getElementById('side');
    side.addEventListener('pointerdown', e => { sx = [e.clientX, e.clientY]; });
    side.addEventListener('pointerup', e => {
      if (!sx) return;
      const dx = e.clientX - sx[0], dy = e.clientY - sx[1]; sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev();
    });
    window.BOOK.restart = () => show(0);
    window.BOOK.next = next;

    // On a tall phone screen, frame the picture a little tighter so it reads larger.
    const portrait = window.matchMedia('(max-aspect-ratio: 5/4)');
    const frame = () => svg.setAttribute('viewBox', portrait.matches ? '150 90 1300 840' : '70 50 1460 900');
    frame();
    if (portrait.addEventListener) portrait.addEventListener('change', frame);
    window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10) || 0; if (n !== at && n >= 0 && n < PAGES.length) show(n); });
    if (location.search.includes('debug')) window.BOOK.debug = { get api() { return api; }, get at() { return at; }, complete() { (PAGES[at].need || []).forEach(k => api.done(k)); } };
    const start = parseInt((location.hash || '').slice(1), 10);
    show(start > 0 && start < PAGES.length ? start : 0);
  })();
  </script>
</body>
</html>
