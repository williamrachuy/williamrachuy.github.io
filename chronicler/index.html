<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Chronicler · Adividiardi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --mono: "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
      --fell: "IM Fell English", Georgia, "Times New Roman", serif;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #d8ccb2;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; display: block; }
    #home, #count {
      position: fixed;
      z-index: 5;
      font: 13px/1 var(--mono);
      color: #4f4738;
      text-decoration: none;
      padding: 12px 14px;
      transition: color .3s, opacity .6s;
    }
    #home { top: env(safe-area-inset-top, 0); left: env(safe-area-inset-left, 0); font-size: 18px; }
    #count {
      bottom: env(safe-area-inset-bottom, 0);
      right: env(safe-area-inset-right, 0);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }
    #count.on { opacity: 1; pointer-events: auto; }
    #mapbtn {
      position: fixed; z-index: 5;
      left: env(safe-area-inset-left, 0); bottom: env(safe-area-inset-bottom, 0);
      font: 14px/1 var(--mono); color: #4f4738; padding: 12px 14px; cursor: pointer;
      opacity: 0; pointer-events: none; transition: opacity 1.2s, color .3s;
    }
    #mapbtn.on { opacity: 1; pointer-events: auto; }
    #sound {
      position: fixed; z-index: 5;
      top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      font: 15px/1 var(--mono); color: #4f4738; padding: 12px 14px; cursor: pointer; transition: opacity .4s, color .3s;
    }
    #sound.off { opacity: 0.3; text-decoration: line-through; }
    #sound:hover { color: #a8977a; }
    #home:hover, #count:hover, #mapbtn:hover { color: #a8977a; }
    #hint {
      position: fixed;
      left: 0; right: 0;
      top: calc(16px + env(safe-area-inset-top, 0));
      text-align: center;
      font: 12px/1 var(--mono);
      letter-spacing: .25em;
      color: #5a5040;
      pointer-events: none;
      transition: opacity 1.6s;
    }
    #hint.off { opacity: 0; }
    #veil {
      position: fixed; inset: 0;
      background: #000;
      pointer-events: none;
      transition: opacity 2.4s ease;
      z-index: 8;
    }
    #veil.off { opacity: 0; }
    #panel {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%) translateY(8px);
      width: min(560px, calc(100vw - 32px));
      max-height: 72vh;
      overflow-y: auto;
      background: rgba(9, 8, 6, 0.95);
      border: 1px solid #3a3226;
      box-shadow: 0 0 0 4px rgba(0,0,0,.6), 0 12px 40px rgba(0,0,0,.8);
      padding: 18px 22px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s, transform .35s;
      z-index: 10;
    }
    #panel.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #ptitle {
      font: 11px/1.4 var(--mono);
      letter-spacing: .18em;
      text-transform: lowercase;
      color: #6f634e;
      margin-bottom: 12px;
    }
    #ptitle:empty { display: none; }
    #pbody {
      font: 19px/1.55 var(--fell);
      color: #e4d8bd;
      white-space: pre-line;
    }
    #pbody .gap { color: #3b342a; font-family: var(--mono); font-size: .8em; letter-spacing: -.02em; }
    #pbody.speech { font-style: italic; color: #cfe0e6; text-align: center; padding: 6px 0; }
    #pbody.note { font: 14px/1.6 var(--mono); color: #8d8068; text-align: center; padding: 4px 0; }
    #pbody .art { font: 13px/1 var(--mono); white-space: pre; display: block; text-align: center; margin: 4px 0 2px; }
    #pbody .entry { margin-bottom: 22px; }
    #pbody .entry:last-child { margin-bottom: 4px; }
    #pbody .entry .src { font: 10px/1.4 var(--mono); letter-spacing: .18em; color: #5d5342; display: block; margin-bottom: 4px; }
    #pmore {
      font: 11px/1 var(--mono);
      color: #5a4f3e;
      text-align: right;
      margin-top: 10px;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: .25; } }
    @media (max-width: 520px) {
      #pbody { font-size: 17px; }
      #pbody .art { font-size: 10px; }
      #panel { padding: 16px 16px 12px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a id="home" href="/" aria-label="back">‹</a>
  <div id="count" role="button" aria-label="journal"></div>
  <div id="mapbtn" role="button" aria-label="map">▦</div>
  <div id="sound" role="button" aria-label="sound">♪</div>
  <div id="hint"></div>
  <div id="panel" role="dialog" aria-live="polite"><div id="ptitle"></div><div id="pbody"></div><div id="pmore">▾</div></div>
  <div id="veil"></div>
  <script src="music.js"></script>
  <noscript><p style="color:#776;font:14px monospace;padding:24px">…</p></noscript>
  <script>
  (() => {
    'use strict';

    // ─── Utilities ─────────────────────────────────────────────────────────
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    function valueNoise(seed) {
      const r = mulberry32(seed), N = 64, g = new Float32Array(N * N);
      for (let i = 0; i < g.length; i++) g[i] = r();
      return (x, y) => {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const x0 = xi & 63, x1 = (xi + 1) & 63, y0 = (yi & 63) * N, y1 = ((yi + 1) & 63) * N;
        const a = g[y0 + x0], b = g[y0 + x1], c = g[y1 + x0], d = g[y1 + x1];
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      };
    }
    const fbm = (n, x, y) => n(x, y) * 0.6 + n(x * 2.03 + 17, y * 2.03 + 5) * 0.3 + n(x * 4.1 + 3, y * 4.1 + 29) * 0.1;
    const hash = (a, b) => { let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35); h ^= h >>> 15; return (h >>> 0) / 4294967296; };

    // ─── Tiles ─────────────────────────────────────────────────────────────
    const GRASS = 0, TALL = 1, FLOWER = 2, TREE = 3, PINE = 4, PATH = 5, WATER = 6, SHALLOW = 7, BRIDGE = 8,
          ROCK = 9, BOULDER = 10, FLOOR = 11, OPEN = 12, WALL = 13, RUBBLE = 14, DEBRIS = 15, COLUMN = 16,
          BROKEN = 17, SHELF = 18, DOOR = 19, MOSAIC = 20, INSCR = 21, LECTERN = 22, TAPESTRY = 23, NICHE = 24,
          MENHIR = 25, CAIRN = 26, TRAIL = 27, REED = 28, SHARD = 29,
          SEA = 30, SURF = 31, SAND = 32, DRIFT = 33, HULL = 34, SCREE = 35, CRAG = 36, SNOW = 37, LEDGE = 38,
          CAVE = 39, WILD = 40, WILDGROW = 41, WARN = 42, FIRE = 43, CART = 44;
    const WALKABLE = new Set([GRASS, TALL, FLOWER, PATH, SHALLOW, BRIDGE, FLOOR, OPEN, DEBRIS, DOOR, MOSAIC, TRAIL, REED, SHARD,
                              SAND, DRIFT, SCREE, LEDGE, WILD]);
    const OPAQUE = new Set([TREE, PINE, ROCK, WALL, INSCR, TAPESTRY, NICHE, CRAG, SNOW, CAVE, WILDGROW]);

    // The ruin and its meadow sit in the middle; around them: the western sea,
    // the mountains to the north, and the edge of the Wild to the east.
    const W = 168, H = 112;
    const OX = 28, OY = 30; // where the original meadow sits in the larger map
    const N = W * H;
    const tile = new Uint8Array(N), vr = new Uint8Array(N), roof = new Uint8Array(N);
    const seen = new Uint8Array(N), vis = new Uint8Array(N);
    const frag = new Map(); // tile index → fragment id
    const idx = (x, y) => y * W + x;
    const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;

    // ─── Writings ──────────────────────────────────────────────────────────
    // Sources: the Adividiardi compendium. The carvings follow its kernel
    // (canon); the tribute roll ('k') and the late scratching ('x') draw on its
    // generated, non-canon history (sim history 20, sweep-0002). None of this is canon.
    const MOONS_ART = [
      '  .    ░        .     ░  ',
      '     ▒▒▒▒▒             . ',
      '   ▒▒▒▒▒▒▒▒▒       ~ ~   ',
      '  ▒▒▓▒▒▒▒▒▒▒▒     ~█~    ',
      '  ▒▒▒▒▒▒▓▓▒▒▒    ~███~   ',
      '  ▒▒▒▒▒▒▒▒▒▒▒     ~█~    ',
      '   ▒▒▒▓▒▒▒▒▒       ~ ~   ',
      '     ▒▒▒▒▒      ░        ',
      '  ░                  .   ',
      '   i   i  i   i   ░░     ',
      '=====░░========░=========',
    ];
    const MOONS_COLORS = { '▒': '#cfc6ad', '▓': '#8b8474', '█': '#4a2550', '~': '#6b3a72', 'i': '#b08a5a', '░': '#2e2619', '.': '#6a6458', '=': '#5a4632' };
    const FALLS_ART = [
      ' ^^^^^^   ░       ^^^^^^ ',
      '^^^^^^^▓▓▓▓▓▓▓▓▓▓^^^^^^^^',
      '  ░    ▓▓|||||||▓▓   ░   ',
      '   i   ▓▓|||||||▓▓       ',
      '       ▓▓|||||||▓▓    i  ',
      '  ░      |||||||   ░     ',
      '       * ~~~·~~~ *       ',
      '     ~~~~·~*~~~·~~~~     ',
      '  ░  ~~~~~~~~~~~~~~~  ░░ ',
      '~~~~~~~~~░░~~~~~~~~~~~~~~',
    ];
    const FALLS_COLORS = { '^': '#5f5a55', '▓': '#3a352e', '|': '#7fa6c8', '~': '#4f77a0', '*': '#bfeaf2', '·': '#9fd6e2', 'i': '#b08a5a', '░': '#2e2619' };
    function artHTML(lines, colors) {
      return '<span class="art">' + lines.map(l => [...l].map(ch => {
        const c = colors[ch];
        return c ? `<span style="color:${c}">${ch}</span>` : ch;
      }).join('')).join('\n') + '</span>';
    }

    // One theme only: what came down, the small moon, the white sky, the one
    // below, the stones that see, the seeing-glass, and the forgetting.
    // Written like labels on things, not like history. Some walls were cut
    // smooth on purpose; those are not counted.
    const FRAGMENTS = {
      '1': { src: 'lintel', text:
        'WHAT CAME DOWN WITH US IS KEPT HERE.\nREAD. DO NOT CARRY IT OUT.' },
      '7': { src: 'carving of the descent', text:
        'We came down out of the Vessel, which had watched a long while before it let us go.\nOf the Vessel, only this is remembered: it did not come back.' },
      '4': { src: 'carving of the second moon', text:
        'Small, and dark, and wrong in its going.\nSomething lay upon it that was older than the asking.' },
      'y': { src: 'tapestry of the two moons', art: MOONS_ART, colors: MOONS_COLORS, text:
        'Rotted through where the dark one was woven.' },
      'a': { src: 'book of the waking', text:
        'The Makers went up to see.\nIt is written that it did not wake.\nIt is written, in a later hand, that it did.' },
      '5': { src: 'carving of the white sky', text:
        'Fire was made above the world, and the sky went white for ▒▒▒ days.\nAfter, glass fell like rain. Where it fell thickest, nothing kept its shape.' },
      '2': { src: 'carving of the one below', text:
        'It fell, and did not die.\nWhat it sheds, grows. In each piece, a stone.\nThe keepers here would not write where it lies.' },
      '3': { src: 'carving of the stones', text:
        'A stone sees a little way ahead. A breath. A step.\nSet one in the unborn, and the child sees with it.\nWhat the child saw is not written here.' },
      'b': { src: 'burned book', text:
        '▒▒▒ the girl who loved a brother ▒▒▒▒ took the seeing-glass ▒▒▒ and we went west ▒▒▒▒▒▒ ▒▒▒ ▒▒▒▒▒' },
      'w': { src: 'tapestry of the falls', art: FALLS_ART, colors: FALLS_COLORS, text:
        'The seeing-glass, broken at the falls.\nOne brother wore the pieces. The other swore them off.\nThe weaver did not finish the second brother’s hands.' },
      '9': { src: 'carving of the wandering light', text:
        'One of the Makers’ lights still crosses the night.\nIt has been called to. It does not answer.' },
      'k': { src: 'tally', text:
        '193 · 307 · 471 · 635 · 767 · 934 · 1087 · 1242 · 1396 ·\nEach is scored through, but the last.\nAfter it, the stone is smooth.' },
      'x': { src: 'scratched low on the outer wall', late: true, text:
        'A child’s hand: a horse, and five small marks.\nThree are circled.' },
      'S': { src: 'inside the niche', text:
        'We wrote it down because we knew we would forget.\nWe forgot anyway.\n\nYou are the chronicler now.' },
      // Cut away, or worn away. Not counted.
      '6': { effaced: true, text: 'Chiselled smooth. The cuts are newer than the wall.' },
      'r': { effaced: true, text: 'Chiselled smooth, all but one word:\n▒▒MINISTR▒▒▒▒' },
      'g': { effaced: true, text: 'Weathered past reading.' },
    };
    const FRAG_TOTAL = Object.keys(FRAGMENTS).filter(k => !FRAGMENTS[k].effaced).length;
    const NEED_FOR_STRANGER = 6;
    const SHELF_LINES = ['Dust.', 'Ash.', 'The spines crumble.', 'A spine, blank where the title was.', 'Nothing legible.', 'Pages fused to stone.'];

    // ─── State (lightly persisted) ─────────────────────────────────────────
    const SAVE_KEY = 'chronicler.v3'; // v3: the writings were narrowed and revised
    const state = { read: [], hasShard: false, nicheOpen: false, visionDone: false, shardTaken: false };
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (s && Array.isArray(s.read)) Object.assign(state, s, { read: s.read.filter(k => FRAGMENTS[k] && !FRAGMENTS[k].effaced) });
    } catch (e) {}
    function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

    // ─── World generation (deterministic) ──────────────────────────────────
    const rng = mulberry32(0xAD1D1A);
    const n1 = valueNoise(11), n2 = valueNoise(23), n3 = valueNoise(37);
    const nc = valueNoise(51);

    const LX = 41 + OX, LY = 12 + OY;
    const LIB = [
      '           #####S#####      ',
      '           2.........3      ',
      '           #.........9      ',
      '     ###w##...........#%,%g##',
      '     #HH.H#......__...#__,__#',
      '     4....#.O....._.O.#_T___%',
      '     #.a..+...........#___%__',
      '     #....#...........+_,___#',
      '     y....#...........#%__T_6',
      '     #.b..#...........#_,___#',
      '     5....#...........#__%%__',
      '     #HH.H#.O.......o.#_%_%%#',
      '     ######...........#r#_###',
      '          7...........#      ',
      '          #.O.......O.#      ',
      '          #...........#      ',
      '          ##x#1...#k###      ',
    ];
    const MOSAIC_C = { x: LX + 16, y: LY + 8 };
    const GROVE = { x: 96 + OX, y: 43 + OY };
    const LEDGE_AT = { x: 84, y: 12 };              // the cult's watch-post on the mountain
    const CAVE_AT = { x: 90, y: 8 };
    const CAMP_Y = 100;                              // families camped by the road south
    const WRECK = { x: 17, y: 70 };
    const MIMIC_HOME = { x: 153, y: 66 };
    const roadX = y => { const oy = y - OY, calm = clamp(Math.abs(oy - 44) / 6 - 0.4, 0, 1);
      return Math.round(57 + OX + calm * (2.2 * Math.sin(oy * 0.17) + 1.3 * Math.sin(oy * 0.05 + 1))); };
    const CAMP = { x: roadX(CAMP_Y) + 6, y: CAMP_Y };
    const START = { x: roadX(H - 5), y: H - 5 };
    const shoreX = y => 13 + Math.round(6 * fbm(n2, y * 0.05, 3.3));
    const ridgeY = x => 24 + Math.round(7 * fbm(n1, x * 0.04, 7.7));
    const wildX = y => 141 + Math.round(6 * fbm(n3, y * 0.05, 11.1));

    function carve(x, y, t) { if (inb(x, y)) tile[idx(x, y)] = t; }

    function generate() {
      for (let i = 0; i < N; i++) vr[i] = (rng() * 256) | 0;
      // Meadow, forest, flowers
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        const ox = x - OX, oy = y - OY;
        const edge = Math.min(x, y, W - 1 - x, H - 1 - y);
        let f = fbm(n1, ox * 0.075 + 64, oy * 0.075 + 64);
        if (ox > 77 && ox < 116 && oy > 24 && oy < 60) f += 0.32;  // the deep east wood
        const band = 3 + n3(x * 0.2, y * 0.2) * 5;
        let t = GRASS;
        if (edge < band || f > 0.6) t = n3(x * 0.11 + 40, y * 0.11) > 0.52 ? PINE : TREE;
        else {
          const m = fbm(n2, x * 0.09, y * 0.09);
          if (m > 0.6 && rng() < 0.35) t = FLOWER;
          else if (m < 0.36 && rng() < 0.5) t = TALL;
          else if (f > 0.52 && rng() < 0.25) t = TALL;
          else if (rng() < 0.012) t = FLOWER;
        }
        tile[i] = t;
      }
      // Crags to the north-east
      for (let y = OY; y < OY + 26; y++) for (let x = 76 + OX; x < 112 + OX; x++) {
        const d = Math.hypot((x - 93 - OX) / 1.3, y - 11 - OY);
        if (d < 8 + n3(x * 0.3, y * 0.3) * 4) {
          const r = n2(x * 0.35 + 9, y * 0.35);
          tile[idx(x, y)] = r > 0.5 ? ROCK : r > 0.42 ? BOULDER : (rng() < 0.4 ? TALL : GRASS);
        }
      }
      // Stream
      // A stream out of the mountains, through the meadow, into the Wild.
      const stream = [[36, 12], [40, 22], [14, 0], [17, 12], [25, 28], [38, 38], [51, 43], [65, 47], [80, 53], [95, 58], [111, 61], [126, 64], [142, 70]]
        .map(([x, y], k) => k < 2 ? [x, y] : [x + OX, y + OY]);
      stampPolyline(stream, (x, y, d) => {
        const i = idx(x, y);
        if (d < 1.3) tile[i] = WATER;
        else if (d < 2.1 && tile[i] !== WATER) tile[i] = SHALLOW;
        else if (d < 3.2 && !OPAQUE.has(tile[i]) && tile[i] !== WATER && tile[i] !== SHALLOW && rng() < 0.35) tile[i] = REED;
      }, 3.3);
      // Pond
      for (let y = 44 + OY; y < 61 + OY; y++) for (let x = 12 + OX; x < 38 + OX; x++) {
        const d = Math.hypot((x - 24 - OX) / 6.5, (y - 52 - OY) / 3.6);
        const i = idx(x, y);
        if (d < 0.72) tile[i] = WATER;
        else if (d < 1.0) tile[i] = SHALLOW;
        else if (d < 1.35 && tile[i] !== WATER && tile[i] !== SHALLOW) tile[i] = rng() < 0.45 ? REED : (rng() < 0.3 ? FLOWER : GRASS);
      }
      // Standing stones
      const ss = { x: 22 + OX, y: 21 + OY };
      for (let y = ss.y - 6; y <= ss.y + 6; y++) for (let x = ss.x - 9; x <= ss.x + 9; x++) {
        if (!inb(x, y)) continue;
        const d = Math.hypot((x - ss.x) / 1.4, y - ss.y);
        const i = idx(x, y);
        if (d < 6 && (tile[i] === TREE || tile[i] === PINE)) tile[i] = d < 4 ? GRASS : TALL;
      }
      for (let k = 0; k < 7; k++) {
        const a = k / 7 * Math.PI * 2 + 0.3;
        const x = Math.round(ss.x + Math.cos(a) * 4.4), y = Math.round(ss.y + Math.sin(a) * 2.6);
        tile[idx(x, y)] = k === 4 ? RUBBLE : MENHIR;
      }
      tile[idx(ss.x, ss.y)] = FLOWER;
      // Library clearing
      for (let y = LY - 5; y <= LY + 21; y++) for (let x = LX - 3; x <= LX + 34; x++) {
        if (!inb(x, y)) continue;
        const i = idx(x, y);
        if (tile[i] === TREE || tile[i] === PINE || tile[i] === ROCK || tile[i] === BOULDER) tile[i] = rng() < 0.3 ? TALL : GRASS;
      }
      // The library
      for (let r = 0; r < LIB.length; r++) {
        const row = LIB[r];
        for (let c = 0; c < row.length; c++) {
          const ch = row[c];
          if (ch === ' ') continue;
          const x = LX + c, y = LY + r, i = idx(x, y);
          let t, rf = 1;
          switch (ch) {
            case '#': t = WALL; rf = 3; break;
            case '.': t = FLOOR; break;
            case '_': t = OPEN; rf = 0; break;
            case ',': t = DEBRIS; rf = 0; break;
            case '%': t = RUBBLE; rf = 0; break;
            case 'O': t = COLUMN; break;
            case 'o': t = BROKEN; break;
            case 'H': t = SHELF; break;
            case '+': t = DOOR; break;
            case 'T': t = TREE; rf = 0; break;
            case 'a': case 'b': t = LECTERN; frag.set(i, ch); break;
            case 'y': case 'w': t = TAPESTRY; rf = 3; frag.set(i, ch); break;
            case 'S': t = NICHE; rf = 3; frag.set(i, ch); break;
            default: t = INSCR; rf = 3; frag.set(i, ch); break; // digits
          }
          tile[i] = t; roof[i] = rf;
        }
      }
      // Mosaic floor in the nave
      for (let y = MOSAIC_C.y - 3; y <= MOSAIC_C.y + 3; y++) for (let x = MOSAIC_C.x - 5; x <= MOSAIC_C.x + 5; x++) {
        const i = idx(x, y);
        if (tile[i] !== FLOOR) continue;
        if (Math.hypot((x - MOSAIC_C.x) / 4.8, (y - MOSAIC_C.y) / 2.9) <= 1) tile[i] = MOSAIC;
      }
      // Fallen stone around the outer walls
      for (let y = LY - 3; y <= LY + 19; y++) for (let x = LX + 2; x <= LX + 32; x++) {
        const i = idx(x, y);
        if (roof[i] || ![GRASS, TALL, FLOWER].includes(tile[i])) continue;
        let near = 99;
        for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
          const j = idx(x + dx, y + dy);
          if (inb(x + dx, y + dy) && (tile[j] === WALL || tile[j] === RUBBLE)) near = Math.min(near, Math.hypot(dx, dy));
        }
        if (near < 3.5) {
          const r = rng();
          if (r < 0.10) tile[i] = BOULDER;
          else if (r < 0.38) tile[i] = DEBRIS;
        }
      }
      // The deep wood: a hidden grove ringed in trees
      for (let y = GROVE.y - 9; y <= GROVE.y + 9; y++) for (let x = GROVE.x - 12; x <= GROVE.x + 12; x++) {
        if (!inb(x, y)) continue;
        const d = Math.hypot((x - GROVE.x) / 1.35, y - GROVE.y);
        const i = idx(x, y);
        if (d < 2.9) tile[i] = rng() < 0.25 ? TALL : (rng() < 0.12 ? FLOWER : GRASS);
        else if (d < 8) tile[i] = n3(x * 0.3, y * 0.3) > 0.5 ? PINE : TREE;
      }
      tile[idx(GROVE.x + 3, GROVE.y - 1)] = WATER;
      tile[idx(GROVE.x + 3, GROVE.y)] = WATER;
      tile[idx(GROVE.x + 2, GROVE.y)] = SHALLOW;
      tile[idx(GROVE.x - 1, GROVE.y + 1)] = BOULDER;
      // A deer trail from the ruin's east side to the grove
      const trail = [[75, 21], [78, 24], [81, 23], [84, 27], [86, 31], [89, 33], [90, 37], [93, 40]].map(([x, y]) => [x + OX, y + OY]).concat([[GROVE.x - 1, GROVE.y]]);
      for (let k = 0; k < trail.length - 1; k++) carveLine4(trail[k], trail[k + 1], (x, y) => {
        const i = idx(x, y);
        if (Math.hypot((x - GROVE.x) / 1.35, y - GROVE.y) < 2.9) return;
        tile[i] = TRAIL;
      });
      tile[idx(74 + OX, 19 + OY)] = CAIRN;
      // The road in from the south
      for (let y = H - 1; y >= LY + 17; y--) {
        let x = roadX(y); // runs straight across the river
        let w = 2;
        if (y < LY + 23) { x = LX + 15; w = 3; }
        for (let k = -4; k <= w + 3; k++) {
          const i = idx(x + k, y);
          const t = tile[i];
          if (k < 0 || k >= w) {
            if ((t === TREE || t === PINE) && (k === -1 || k === w || hash(i, 3) < 0.6)) tile[i] = hash(i, 4) < 0.5 ? TALL : GRASS;
            continue;
          }
          tile[i] = (t === WATER || t === SHALLOW || t === BRIDGE) ? BRIDGE : PATH;
        }
      }
      // Bridges need clean banks: widen water crossing to fully bridged
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (tile[i] !== BRIDGE) continue;
        for (const [dx, dy] of [[0, -1], [0, 1]]) {
          const j = idx(x + dx, y + dy);
          if (inb(x + dx, y + dy) && tile[j] === WATER) tile[j] = BRIDGE;
        }
      }
      generateMargins();
    }

    // ─── The wider country (sea, mountains, the Wild, the road south) ──────
    function generateMargins() {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        // The western sea
        const sx = shoreX(y);
        if (x < sx - 3) { tile[i] = SEA; continue; }
        if (x < sx) { tile[i] = SURF; continue; }
        if (x < sx + 3 + (vr[i] & 1)) { tile[i] = rng() < 0.05 ? DRIFT : SAND; continue; }
        if (x < sx + 6 && tile[i] !== WATER && tile[i] !== SHALLOW) { tile[i] = rng() < 0.5 ? TALL : GRASS; continue; }
        // The mountains
        const ry = ridgeY(x);
        if (y < ry && tile[i] !== WATER && tile[i] !== SHALLOW) {
          const h = ry - y + n3(x * 0.2, y * 0.2) * 4;
          if (h > 17) tile[i] = SNOW;
          else if (fbm(n2, x * 0.13 + 20, y * 0.13) > 0.56 - h * 0.008) tile[i] = CRAG;
          else tile[i] = h < 3 && rng() < 0.3 ? BOULDER : SCREE;
          continue;
        }
        // The edge of the Wild
        const wx = wildX(y), depth = x - wx;
        if (depth > 0) {
          if (depth > 19) tile[i] = WILDGROW;
          else tile[i] = fbm(n1, x * 0.16 + 9, y * 0.16) > 0.58 - depth * 0.006 ? WILDGROW : WILD;
        }
      }
      // Stones stacked at the edge of the Wild
      for (let y = 6; y < H - 6; y += 9) {
        const x = wildX(y) - 1;
        if (WALKABLE.has(tile[idx(x, y)])) tile[idx(x, y)] = WARN;
      }
      // A clearing in the Wild where someone lives
      for (let y = MIMIC_HOME.y - 3; y <= MIMIC_HOME.y + 3; y++) for (let x = MIMIC_HOME.x - 5; x <= MIMIC_HOME.x + 5; x++)
        if (Math.hypot((x - MIMIC_HOME.x) / 1.6, y - MIMIC_HOME.y) < 3) tile[idx(x, y)] = WILD;
      // A trail up the mountain to the watch-post, and on to the cave
      const climb = [[LX + 15, LY - 4], [LX + 13, LY - 9], [LX + 16, LY - 13], [LX + 12, LY - 18], [LX + 15, LY - 22], [LX + 11, LY - 26], [LEDGE_AT.x, LEDGE_AT.y]];
      for (let k = 0; k < climb.length - 1; k++) carveLine4(climb[k], climb[k + 1], (x, y) => {
        const t = tile[idx(x, y)];
        if (t === WATER || t === SHALLOW) tile[idx(x, y)] = BRIDGE; else tile[idx(x, y)] = y < ridgeY(x) + 1 ? LEDGE : (t === TREE || t === PINE || t === ROCK ? GRASS : t);
      });
      for (let y = LEDGE_AT.y - 2; y <= LEDGE_AT.y + 1; y++) for (let x = LEDGE_AT.x - 3; x <= LEDGE_AT.x + 3; x++) tile[idx(x, y)] = LEDGE;
      for (let y = CAVE_AT.y - 2; y <= CAVE_AT.y + 1; y++) for (let x = CAVE_AT.x - 2; x <= CAVE_AT.x + 2; x++) tile[idx(x, y)] = CRAG;
      carveLine4([LEDGE_AT.x + 3, LEDGE_AT.y - 1], [CAVE_AT.x, CAVE_AT.y + 1], (x, y) => { tile[idx(x, y)] = LEDGE; });
      tile[idx(CAVE_AT.x, CAVE_AT.y)] = CAVE;
      // The families' camp by the road
      for (let y = CAMP.y - 3; y <= CAMP.y + 3; y++) for (let x = CAMP.x - 6; x <= CAMP.x + 8; x++)
        if (Math.hypot((x - CAMP.x - 1) / 2.2, y - CAMP.y) < 3.2 && tile[idx(x, y)] !== PATH) tile[idx(x, y)] = hash(x, y) < 0.3 ? DEBRIS : GRASS;
      tile[idx(CAMP.x, CAMP.y)] = FIRE;
      for (let x = CAMP.x + 4; x <= CAMP.x + 6; x++) tile[idx(x, CAMP.y - 2)] = CART;
      // A wreck on the beach
      for (let y = WRECK.y - 1; y <= WRECK.y + 1; y++) for (let x = WRECK.x - 3; x <= WRECK.x + 3; x++)
        if (Math.hypot((x - WRECK.x) / 3.4, y - WRECK.y) < 1.15 && hash(x, y * 3) > 0.15) tile[idx(x, y)] = HULL;
      for (let x = WRECK.x - 5; x <= WRECK.x + 5; x++) for (let y = WRECK.y - 2; y <= WRECK.y + 2; y++)
        if (tile[idx(x, y)] === SAND && hash(x * 7, y) < 0.18) tile[idx(x, y)] = DRIFT;
    }

    // Make sure every place that matters can be walked to from the road.
    function ensureReachable(targets) {
      for (let pass = 0; pass < targets.length + 1; pass++) {
        const reach = new Uint8Array(N);
        const q = [idx(START.x, START.y)];
        reach[q[0]] = 1;
        for (let h = 0; h < q.length; h++) {
          const c = q[h], cx = c % W, cy = (c - cx) / W;
          for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
            const nx = cx + dx, ny = cy + dy;
            if (!inb(nx, ny)) continue;
            const j = idx(nx, ny);
            if (reach[j] || !WALKABLE.has(tile[j])) continue;
            reach[j] = 1; q.push(j);
          }
        }
        const lost = targets.find(([tx, ty]) => ![[0, -1], [1, 0], [0, 1], [-1, 0]].some(([dx, dy]) => inb(tx + dx, ty + dy) && reach[idx(tx + dx, ty + dy)]));
        if (!lost) return;
        let best = null, bd = 1e9;
        for (const c of q) { const cx = c % W, cy = (c - cx) / W, d = Math.hypot(cx - lost[0], cy - lost[1]); if (d < bd) { bd = d; best = [cx, cy]; } }
        carveLine4(best, lost, (x, y) => {
          if (x === lost[0] && y === lost[1]) return;
          const i = idx(x, y), t = tile[i];
          if (WALKABLE.has(t) || roof[i] || frag.has(i) || [FIRE, CART, HULL, CAVE, WARN, MENHIR].includes(t)) return;
          tile[i] = t === WATER || t === SHALLOW ? BRIDGE : t === WILDGROW ? WILD : (t === CRAG || t === SNOW) ? LEDGE : t === SEA || t === SURF ? SAND : TRAIL;
        });
      }
    }

    function stampPolyline(pts, fn, rad) {
      const best = new Float32Array(N).fill(99);
      for (let k = 0; k < pts.length - 1; k++) {
        const [ax, ay] = pts[k], [bx, by] = pts[k + 1];
        const minx = Math.max(0, Math.min(ax, bx) - 5), maxx = Math.min(W - 1, Math.max(ax, bx) + 5);
        const miny = Math.max(0, Math.min(ay, by) - 5), maxy = Math.min(H - 1, Math.max(ay, by) + 5);
        const vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy;
        for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
          let t = ((x - ax) * vx + (y - ay) * vy) / L2;
          t = clamp(t, 0, 1);
          const wob = (n3(x * 0.25, y * 0.25) - 0.5) * 1.4;
          const d = Math.hypot(x - (ax + vx * t), y - (ay + vy * t)) + wob;

          if (d < best[i]) best[i] = d;

      }

        if (d < rad) fn(x, y, d);
