<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050608">
<title>Reading profiles — demo</title>
<!-- Posts are discovered by listing posts/ through the GitHub Contents API, so
     the page needs to know which repo it lives in. It works that out from the
     hostname on a *.github.io site. On a custom domain, name the repo here. -->
<meta name="github-repo" content="williamrachuy/williamrachuy.github.io">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d6ba7c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="controls" aria-label="Demo controls">
  <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel">
    <span class="dot"></span>
    <span class="lbl">Demo controls</span>
    <span id="engine-status" data-mode="idle">…</span>
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="panel"></div>
</div>

<div id="vignette" aria-hidden="true"></div>

<main id="stage"></main>
<div id="spacer"></div>

<p id="boot">Setting the type…</p>
<p id="fatal" hidden></p>

<!-- Real text for screen readers, search engines, and anyone with JS off.
     The visual profiles are all aria-hidden. -->
<div id="reader-text" class="sr-only"></div>

<script type="module" src="assets/app.js"></script>
<noscript><style>#reader-text{position:static;width:auto;height:auto;clip:auto;margin:0 auto;padding:24px;max-width:36rem;color:#d8d0c1}#boot{display:none}</style></noscript>
</body>
</html>
